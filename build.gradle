plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.138'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.java.srcDir 'src/stubs/java'

// This repo used to hold another mod (Copycat Casing). If any of its files are still present they are ignored here, so
// they can never end up in this mod's jar and clash with the real Copycat Casing mod.
sourceSets.main.java.exclude 'com/boydsquirrel/copycatcasing/**'
sourceSets.main.resources.exclude 'assets/copycatcasing/**', 'data/copycatcasing/**'

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" } // NeoForge config api port, needed by Ponder
    maven { url = "https://maven.ryanhcode.dev/releases" } // Sable, Simulated, Offroad
    maven { url = "https://maven.ryanhcode.dev/snapshots" }
    maven { url = "https://maven.blamejared.com/" }
}

base {
    archivesName = 'navlights'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neo_version
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}


// The Offroad stubs exist only so this mod can compile; the real classes come from the Offroad mod at runtime.
tasks.named('jar', Jar) {
    exclude 'dev/ryanhcode/offroad/**'
    exclude 'com/boydsquirrel/copycatcasing/**', 'assets/copycatcasing/**', 'data/copycatcasing/**'
}
